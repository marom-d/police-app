<iframe id="a" title="מרכז הגיוס" allow="microphone; camera; autoplay; clipboard-write; fullscreen"></iframe>
<script>
var q = new URLSearchParams(location.search);
var t = q.get("t");
if (t) document.getElementById("a").src = "https://maromdemo.app.demo.wonderful.ai/app-view/?access_token=" + encodeURIComponent(t) + "&c=" + encodeURIComponent(q.get("c") || "C-24017");
</script>
